/* ============ FULLSCREEN & TIMER SYNC ============ */
function requestAppFullscreen(){
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if(fn){
    try {
      const p = fn.call(el);
      if(p && p.catch) p.catch(() => {});
    } catch {
      // Ignore gesture errors
    }
  }
}

document.addEventListener('click', () => {
  if(S.user?.role === 'participant' && S.eventStarted && !S.isBlocked && !document.fullscreenElement){
    requestAppFullscreen();
  }
}, true);

function setBlockedState(blocked, canReenter = false){
  S.isBlocked = blocked;
  const el = $('#fs-blocker');
  const actionEl = $('#fs-unblock-action');
  const textEl = $('#fs-blocker-text');
  if(!el) return;
  if(blocked){
    el.hidden = false;
    if(canReenter){
      if(textEl) textEl.innerHTML = '<span style="color:var(--amber);">Access reauthorized by Administrator.</span>';
      if(actionEl) actionEl.hidden = false;
    } else {
      if(textEl) textEl.innerHTML = 'fullscreen mode exited<br>Inform an admin to get unblocked';
      if(actionEl) actionEl.hidden = true;
    }
  } else {
    el.hidden = true;
  }
}

function handleFullscreenExit(){
  if(IS_FILE || !S.eventStarted || !S.user || S.user.role === 'admin' || S.isBlocked || S.unblocking) return;
  setBlockedState(true, false);
  API.reportFullscreenExit().catch(() => {});
}

document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && S.eventStarted && S.user?.role === 'participant'){
    handleFullscreenExit();
  }
});
window.addEventListener('blur', () => {
  if(S.eventStarted && S.user?.role === 'participant'){
    handleFullscreenExit();
  }
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden && S.eventStarted && S.user?.role === 'participant'){
    handleFullscreenExit();
  }
});

$('#fs-start-btn')?.addEventListener('click', () => {
  const modal = $('#fs-entry');
  if(modal) modal.hidden = true;
  requestAppFullscreen();
});

$('#fs-reenter-btn')?.addEventListener('click', () => {
  S.unblocking = true;
  setBlockedState(false);
  requestAppFullscreen();
  setTimeout(() => { S.unblocking = false; }, 1000);
});

function handleTimerStarted(serverStartTimeStr){
  if(S.eventStarted) return;
  S.eventStarted = true;
  S.serverStartTime = new Date(serverStartTimeStr).getTime();
  S.t0 = S.serverStartTime;
  if(S.user?.role === 'participant'){
    const modal = $('#fs-entry');
    if(modal) modal.hidden = false;
    requestAppFullscreen();
  }
  render();
}

async function initClockSync(){
  if(IS_FILE) return;
  const samples = [];
  for(let i=0; i<3; i++){
    const t0 = performance.now();
    try {
      const data = await API.syncClock();
      const t1 = performance.now();
      const latency = (t1 - t0) / 2;
      const offset = (data.server_time + latency) - Date.now();
      samples.push(offset);
    } catch (err) {
      void err;
    }
  }
  if(samples.length){
    samples.sort((a,b) => a-b);
    S.clockOffset = samples[Math.floor(samples.length/2)];
  }
}

async function initSession(){
  if(IS_FILE) return;
  const token = localStorage.getItem('tb_token');
  if(!token) return;
  try {
    S.user = { token };
    const data = await API.getSession();
    if(data.valid){
      S.user = {
        register_number: data.register_number,
        role: data.role,
        token
      };
      S.participant = data.register_number;
      if(data.is_blocked){
        setBlockedState(true, false);
      }
      if(data.subs){
        Object.assign(S.subs, data.subs);
      }
      if(data.accusation){
        S.accusation = data.accusation;
      }
      if(data.role === 'admin'){
        const ov = await API.adminOverview().catch(() => null);
        if(ov) S.adminOverview = ov;
      } else if(data.event_state && data.event_state.is_started){
        S.eventStarted = true;
        S.serverStartTime = new Date(data.event_state.server_start_time).getTime();
        S.t0 = S.serverStartTime;
        if(!document.fullscreenElement && !data.is_blocked){
          const modal = $('#fs-entry');
          if(modal) modal.hidden = false;
        }
      }
    } else {
      localStorage.removeItem('tb_token');
      S.user = null;
    }
  } catch (err) {
    void err;
  }
}

function initRealtime(){
  if(IS_FILE) return;
  // Fast periodic sync for multi-client state consistency
  setInterval(async () => {
    if(!S.user) return;
    try {
      if(S.user.role === 'admin'){
        const ov = await API.adminOverview();
        if(ov){
          S.adminOverview = ov;
          if(ov.event_state?.is_started && !S.eventStarted){
            S.eventStarted = true;
            S.serverStartTime = new Date(ov.event_state.server_start_time).getTime();
            S.t0 = S.serverStartTime;
          } else if(!ov.event_state?.is_started && S.eventStarted){
            S.eventStarted = false;
            S.serverStartTime = null;
            S.t0 = null;
          }
          if(typeof ov.event_state?.scores_revealed === 'boolean'){
            S.scoresRevealed = ov.event_state.scores_revealed;
          }
          if(location.hash.startsWith('#/admin')){
            if(isUserTyping() || $('#admin-clock-card')){
              updateAdminLiveElements(ov);
            } else {
              render();
            }
          }
        }
      } else if(S.user.role === 'participant'){
        const sess = await API.getSession();
        if(sess){
          if(sess.event_state?.is_started && !S.eventStarted){
            handleTimerStarted(sess.event_state.server_start_time);
          } else if((!sess.event_state || !sess.event_state.is_started) && (S.eventStarted || Object.keys(S.subs).length > 0 || S.accusation)){
            S.eventStarted = false;
            S.serverStartTime = null;
            S.t0 = null;
            S.scoresRevealed = false;
            S.subs = {};
            S.hints = {};
            S.accusation = null;
            S.score = 0;
            S.opened = {};
            S.pending = {};
            S.pendingTime = {};
            S.isBlocked = false;
            const blocker = $('#fs-blocker');
            if(blocker) blocker.classList.remove('active');
            const entryModal = $('#fs-entry');
            if(entryModal) entryModal.hidden = true;
            if(location.hash !== '#/' && !location.hash.startsWith('#/briefing')){
              location.hash = '#/';
            } else {
              render();
            }
          }
          if(typeof sess.event_state?.scores_revealed === 'boolean'){
            const prev = S.scoresRevealed;
            S.scoresRevealed = sess.event_state.scores_revealed;
            if(prev !== S.scoresRevealed && location.hash.startsWith('#/results')){
              render();
            }
          }
          if(sess.is_blocked && !S.isBlocked){
            setBlockedState(true, false);
          } else if(!sess.is_blocked && S.isBlocked){
            setBlockedState(true, true);
          }
        }
      }
    } catch (err) {
      void err;
    }
  }, 1500);
}

/* ============ ROUTER ============ */
function render(){
  const raw = (location.hash.slice(1) || '/').split('?')[0];
  const parts = raw.split('/').filter(Boolean);

  // 1. Enforce authentication: if not logged in (or explicitly on #/login), render single login view
  if((!S.user || parts[0] === 'login') && (!IS_FILE || parts[0] === 'login')){
    const app = $('#app');
    if(app.dataset.route !== '/login'){
      app.innerHTML = loginView();
      app.dataset.route = '/login';
      bindLogin();
      document.title = 'TECH BLITZ | Terminal Authorization';
    }
    lastPhase = phaseKey();
    return;
  }

  // 2. Admin Route Protection
  if(parts[0] === 'admin'){
    if(S.user && S.user.role !== 'admin'){
      location.hash = '#/';
      return;
    }
    const savedFocusId = document.activeElement?.id;
    const savedPartVal = $('#add-part-reg')?.value;
    const savedAdminVal = $('#add-admin-reg')?.value;
    const savedSelStart = document.activeElement?.selectionStart;
    const savedSelEnd = document.activeElement?.selectionEnd;

    const app = $('#app');
    app.innerHTML = adminView();
    app.dataset.route = '/admin';
    bindAdmin();
    document.title = 'TECH BLITZ | Admin Console';

    if(savedPartVal && $('#add-part-reg')) $('#add-part-reg').value = savedPartVal;
    if(savedAdminVal && $('#add-admin-reg')) $('#add-admin-reg').value = savedAdminVal;
    if(savedFocusId && document.getElementById(savedFocusId)){
      const el = document.getElementById(savedFocusId);
      el.focus();
      if(typeof savedSelStart === 'number' && typeof savedSelEnd === 'number' && el.setSelectionRange){
        el.setSelectionRange(savedSelStart, savedSelEnd);
      }
    }

    if(!S.adminOverview){
      API.adminOverview().then(ov => {
        if(ov){
          S.adminOverview = ov;
          updateAdminLiveElements(ov);
        }
      }).catch(() => {});
    }
    lastPhase = phaseKey();
    return;
  }

  // 3. Quiz conclusion: redirect participants away from puzzle solving if event expired
  if(isEventExpired() && S.user?.role === 'participant' && ['challenge','final-deduction'].includes(parts[0])){
    location.hash = '#/results';
    return;
  }

  if(IS_FILE && parts[0] === 'briefing' && S.t0 == null) S.t0 = now();
  if(['briefing','evidence','suspects'].includes(parts[0])) S.seen[parts[0]] = true;
  document.body.dataset.tex = !parts.length ? 'landing'
    : ['briefing','evidence','suspects'].includes(parts[0]) ? 'archive'
    : parts[0] === 'challenge' ? 'work' : 'dash';

  const app = $('#app');
  const prevScroll = window.scrollY;
  let view, bind = () => {};

  if(!parts.length) view = landing();
  else if(parts[0]==='briefing') view = briefing();
  else if(parts[0]==='suspects') view = suspectsPage();
  else if(parts[0]==='investigation' && parts[1]) { view = detectivePage(parts[1]); bind = () => bindDetectivePage(parts[1]); }
  else if(parts[0]==='investigation') view = dashboard();
  else if(parts[0]==='challenge') { view = workspace(parts[1]); bind = () => bindWorkspace(parts[1]); }
  else if(parts[0]==='evidence') { view = evidence(); bind = bindEvidence; }
  else if(parts[0]==='final-deduction') { view = deduction(); bind = bindDeduction; }
  else if(parts[0]==='results') view = results();
  else view = notFound();

  const sameRoute = app.dataset.route === raw;
  app.innerHTML = view; app.dataset.route = raw;
  bind(); bindShell(); bindHero();
  lastPhase = phaseKey();
  if(sameRoute) window.scrollTo(0, prevScroll);
  else { window.scrollTo(0,0); const m = $('#main'); if(m && parts.length){ m.setAttribute('tabindex','-1'); m.focus({preventScroll:true}); } }
  document.title = 'TECH BLITZ | ' + (parts.length ? ($('h1')?.textContent || 'The Jane Protocol') : 'The Jane Protocol');
}

function bindHero(){
  const z = $('#jane-zone'); if(!z) return;
  const toggle = () => { const on = !z.classList.contains('show'); z.classList.toggle('show', on); z.setAttribute('aria-pressed', on); };
  z.addEventListener('click', toggle);
  z.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } });
}

let lastPhase = '';
function phaseKey(){
  const m = location.hash.match(/challenge\/([\w-]+)/);
  const hint = m && S.opened[m[1]] ? now() >= S.opened[m[1]] + HINT_DELAY_MS : false;
  return [S.t0 != null, now() >= ((windows()||[])[0]||{}).open, ...DATA.detectives.map(d => +detUnlocked(d.id) + '' + +detClosed(d.id)), hint, isEventExpired(), areScoresRevealed()].join('|');
}

setInterval(() => {
  const curNow = now();
  const curClock = clockState();
  const expired = isEventExpired();

  // 1. Live Countdown Updates
  document.querySelectorAll('[data-until]').forEach(el => {
    const targetTs = +el.dataset.until;
    if(targetTs > 0){
      el.textContent = fmtMs(targetTs - curNow);
    }
  });

  // 2. Progress Meters
  document.querySelectorAll('[data-meter-to]').forEach(el => {
    const a = +el.dataset.meterFrom, b = +el.dataset.meterTo;
    if(b > a){
      el.style.width = Math.max(0, Math.min(100, (b - curNow) / (b - a) * 100)) + '%';
    }
  });

  // 3. Dynamic Phase Elements
  document.querySelectorAll('[data-live-phase]').forEach(el => {
    if(curClock.ts){
      el.dataset.until = curClock.ts;
      el.textContent = fmtMs(curClock.ts - curNow);
    } else {
      el.textContent = '00:00';
    }
  });
  document.querySelectorAll('[data-live-phase-label]').forEach(el => {
    el.textContent = curClock.label;
  });
  document.querySelectorAll('[data-live-phase-msg]').forEach(el => {
    el.textContent = curClock.msg;
  });
  document.querySelectorAll('[data-live-total]').forEach(el => {
    if(S.t0 != null){
      const totalEnd = S.t0 + 4200000;
      el.dataset.until = totalEnd;
      el.textContent = fmtMs(totalEnd - curNow);
    }
  });

  // 4. Case ends for everyone after the final 20 mins with Lisbon
  if(expired && S.user?.role === 'participant' && !location.hash.startsWith('#/results')){
    location.hash = '#/results';
    render();
    return;
  }

  // 5. Phase transition rendering (guarded against active typing)
  if(phaseKey() !== lastPhase && !$('#dlg')?.open && !isUserTyping()){
    const focusId = document.activeElement?.id;
    render();
    if(focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
  }
}, 1000);

function bindShell(){
  document.querySelectorAll('[data-skew]').forEach(b => b.addEventListener('click', () => {
    if(S.t0 == null) S.t0 = now();
    if(b.dataset.skew === 'next'){ const t = now(), nxt = windows().flatMap(w => [w.open, w.close]).filter(x => x > t)[0]; if(nxt) S.skew += nxt - t + 50; }
    else S.skew += +b.dataset.skew;
    render();
  }));
  $('#menu-btn')?.addEventListener('click', e => { const s = $('#side'), open = !s.classList.contains('open'); s.classList.toggle('open', open); e.target.setAttribute('aria-expanded', open); e.target.textContent = open?'Close':'Menu'; });
  document.querySelectorAll('[data-suspect]').forEach(b => b.addEventListener('click', () => openSuspect(b.dataset.suspect, b)));
  
  const handleLogout = () => {
    localStorage.removeItem('tb_token');
    S.user = null;
    location.hash = '#/';
    render();
  };
  $('#shell-logout-btn')?.addEventListener('click', handleLogout);
  $('#topbar-logout-btn')?.addEventListener('click', handleLogout);
}

document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeEvidence(); const s=$('#side'); if(s?.classList.contains('open')) $('#menu-btn').click(); } });
window.addEventListener('hashchange', render);

// Startup Pipeline: Sync Clock -> Hydrate Session -> Poll/Listen -> Render
if (IS_FILE) {
  render();
} else {
  (async () => {
    await initClockSync();
    await initSession();
    initRealtime();
    render();
  })();
}
</script>
</body>
