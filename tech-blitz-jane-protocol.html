/* ============ DESIGN TOKENS ============ */
:root{
  --obsidian:#0A0A0B; --charcoal:#151619; --charcoal-2:#1C1D21; --paper:#F0EEE9;
  --red:#B8272D; --red-ink:#E5535A; --steel:#536D9A; --steel-ink:#8EA6CF;
  --amber:#C79A55; --slate:#85858A; --line:#303136;
  --display:'TB Bebas Neue','Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;
  --body:'TB Inter','Inter','Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'TB IBM Plex Mono','IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;
}
/* The identity is intentionally dark in both system themes */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --obsidian:#0A0A0B; --paper:#F0EEE9; } }
:root[data-theme="dark"]{ --obsidian:#0A0A0B; --paper:#F0EEE9; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--obsidian); color:var(--paper); font:400 16px/1.6 var(--body); -webkit-font-smoothing:antialiased; }
img,svg{ max-width:100%; display:block; }
a{ color:inherit; }
button,input,textarea,select{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }
/* <main> receives focus on route change so screen readers announce the page; it isn't interactive, so no ring */
#main:focus, #main:focus-visible{ outline:none; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.halftone{ background-image:radial-gradient(circle, rgba(10,10,11,.35) 1px, transparent 1.5px); background-size:5px 5px; }
.halftone-light{ background-image:radial-gradient(circle, rgba(240,238,233,.14) 1px, transparent 1.5px); background-size:5px 5px; }

/* ============ TYPE ============ */
.display{ font-family:var(--display); font-weight:400; letter-spacing:.01em; line-height:.86; margin:0; }
.mono{ font-family:var(--mono); font-size:.8rem; letter-spacing:.02em; }
.muted{ color:var(--slate); }
h1,h2,h3{ margin:0; }
p{ margin:0 0 1em; max-width:66ch; }

/* ============ BUTTONS ============ */
.btn{ display:inline-flex; align-items:center; gap:.6rem; min-height:46px; padding:.7rem 1.3rem; border:1px solid var(--paper);
  background:transparent; font-weight:600; font-size:.92rem; letter-spacing:.06em; text-transform:uppercase; text-decoration:none; cursor:pointer;
  transition:background .2s var(--ease), color .2s var(--ease), transform .1s; }
.btn:hover{ background:var(--paper); color:var(--obsidian); }
.btn:active{ transform:translateY(1px); }
.btn-red{ background:var(--red); border-color:var(--red); color:#fff; }
.btn-red:hover{ background:#9E1F25; border-color:#9E1F25; color:#fff; }
.btn-ghost{ border-color:var(--line); }
.btn-ghost:hover{ background:var(--charcoal-2); color:var(--paper); border-color:var(--slate); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.link{ color:var(--paper); text-underline-offset:5px; text-decoration-thickness:1px; font-weight:500; }
.link:hover{ color:var(--amber); }

/* ============ LANDING ============ */
.topbar{ position:absolute; top:0; left:0; right:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:1.4rem clamp(1.2rem,4vw,3rem); }
.topbar nav{ display:flex; gap:1.6rem; font-size:.88rem; }
.topbar nav a{ text-decoration:none; color:var(--slate); } .topbar nav a:hover{ color:var(--paper); }
.wordmark{ font-family:var(--display); font-size:1.6rem; letter-spacing:.04em; text-decoration:none; line-height:1; }
.wordmark i{ font-style:normal; color:var(--red); }

.hero{ position:relative; min-height:100vh; min-height:100svh; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); overflow:hidden; }
.hero-copy{ position:relative; z-index:3; padding:7rem 0 3rem clamp(1.2rem,4vw,3rem); display:flex; flex-direction:column; justify-content:flex-end; }
.hero-file{ color:var(--slate); margin-bottom:auto; }
.hero-file b{ color:var(--paper); font-weight:500; }
.hero-mark{ font-size:clamp(6.5rem,17vw,17.5rem); margin-right:-28vw; position:relative; z-index:3; }
.hero-mark span{ display:block; }
.hero-mark span:last-child{ padding-left:.32em; }
.hero-sub{ display:flex; align-items:center; gap:1rem; margin:1.2rem 0 1.8rem; }
.hero-sub::before{ content:""; width:56px; height:3px; background:var(--red); }
.hero-sub h2{ font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,2.8vw,2.4rem); letter-spacing:.08em; }
.hero-tag{ font-family:var(--display); font-size:clamp(1.3rem,2vw,1.7rem); letter-spacing:.05em; margin-bottom:.4rem; }
.hero-support{ color:#C9C7C1; max-width:40ch; }
.hero-cta{ display:flex; flex-wrap:wrap; gap:1.4rem; align-items:center; margin-top:1rem; }

.panels{ position:relative; display:grid; grid-template-rows:1.5fr .55fr 1fr; gap:10px; padding:4.6rem 10px 10px 0; min-height:100svh; }
.panel{ position:relative; overflow:hidden; clip-path:inset(0 0 0 0); }
.p-door{ background:var(--steel); }
.p-door .doorlight{ position:absolute; right:22%; top:12%; bottom:0; width:18%; background:var(--paper); }
.p-door .jane-zone{ position:absolute; right:6%; bottom:0; height:96%; aspect-ratio:695/971; z-index:2; cursor:pointer; outline-offset:-4px; -webkit-tap-highlight-color:transparent; }
.p-door .hero-jane{ position:absolute; inset:auto 0 0 auto; height:100%; width:auto; max-width:none; filter:grayscale(1) contrast(1.18) brightness(.95); }
.p-door .frost{ pointer-events:none; z-index:3; }
.p-door .cbi-id{ position:absolute; right:44%; bottom:10%; height:62%; width:auto; z-index:1; pointer-events:none;
  box-shadow:0 18px 40px rgba(10,10,11,.5); opacity:0; visibility:hidden;
  transform:translate(55%,4%) rotate(5deg) scale(.9);
  transition:opacity .3s var(--ease), transform .55s var(--ease), visibility 0s linear .55s; }
.p-door .jane-zone:hover ~ .cbi-id, .p-door .jane-zone:focus-visible ~ .cbi-id, .p-door .jane-zone.show ~ .cbi-id{
  opacity:1; visibility:visible; transform:translate(0,0) rotate(-7deg) scale(1); transition-delay:0s; }
.p-door .cap{ transition:opacity .25s; }
.p-door .jane-zone:hover ~ .cap, .p-door .jane-zone:focus-visible ~ .cap, .p-door .jane-zone.show ~ .cap{ opacity:0; }
.p-door .cap{ position:absolute; left:1.2rem; top:1rem; margin:0; z-index:4; color:var(--obsidian); max-width:24ch; }
.p-door .frost{ position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(10,10,11,.25)); }
.p-window{ background:var(--charcoal); display:flex; flex-direction:column; justify-content:center; padding:0 clamp(1rem,3vw,2.2rem); }
.tl-bar{ position:relative; height:2px; background:var(--line); margin:1.6rem 0 1rem; }
.tl-bar .win{ position:absolute; left:14%; width:34%; top:-5px; height:12px; background:var(--red); }
.tl-bar .pt{ position:absolute; top:-5px; width:12px; height:12px; border-radius:50%; background:var(--paper); transform:translateX(-50%); }
.tl-labels{ position:relative; height:2.6rem; color:var(--slate); }
.tl-labels span{ position:absolute; transform:translateX(-50%); white-space:nowrap; }
.tl-labels .w{ color:var(--red-ink); }
.p-paper{ background:var(--paper); color:var(--obsidian); display:flex; align-items:flex-end; }
.p-paper .giant{ font-family:var(--display); font-size:clamp(7rem,15vw,15rem); line-height:.72; margin:0 0 -.06em -.04em; letter-spacing:-.01em; white-space:nowrap; }
.p-paper .amber-slit{ position:absolute; top:0; bottom:0; right:9%; width:14px; background:var(--amber); }

@media (prefers-reduced-motion: no-preference){
  .panel{ animation:cut .9s var(--ease) both; }
  .p-door{ animation-delay:.05s } .p-window{ animation-delay:.2s } .p-paper{ animation-delay:.35s }
  .tl-bar .win{ animation:grow 1s .9s var(--ease) both; transform-origin:left; }
  @keyframes cut{ from{ clip-path:inset(0 0 0 100%); } to{ clip-path:inset(0 0 0 0); } }
  @keyframes grow{ from{ transform:scaleX(0) } to{ transform:scaleX(1) } }
}

.section{ padding:clamp(4rem,9vw,8rem) clamp(1.2rem,4vw,3rem); border-top:1px solid var(--line); }
.case-intro{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:clamp(2rem,6vw,6rem); align-items:end; }
.case-intro .display{ font-size:clamp(4rem,10vw,9rem); }
.case-intro .display small{ display:block; font-size:.32em; color:var(--red-ink); letter-spacing:.08em; margin-bottom:.3em; }
.facts{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); margin:2rem 0; }
.facts div{ padding:1rem 0; border-bottom:1px solid var(--line); }
.facts dt{ color:var(--slate); font-size:.85rem; }
.facts dd{ margin:0; font-family:var(--display); font-size:2rem; line-height:1.1; letter-spacing:.03em; }

.detective-strip{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-left:1px solid var(--line); margin-top:3rem; }
.det-col{ position:relative; min-height:420px; border-right:1px solid var(--line); padding:1.4rem; display:flex; flex-direction:column; justify-content:flex-end; text-decoration:none; overflow:hidden; transition:background .3s var(--ease); }
.det-col .letter{ position:absolute; top:-.08em; right:-.05em; font-family:var(--display); font-size:22rem; line-height:1; color:transparent; -webkit-text-stroke:1px var(--line); transition:-webkit-text-stroke-color .3s; }
.det-col:hover, .det-col:focus-visible{ background:var(--charcoal); }
.det-col:hover .letter{ -webkit-text-stroke-color:var(--steel); }
.det-col h3{ font-family:var(--display); font-weight:400; font-size:3rem; line-height:1; letter-spacing:.03em; position:relative; }
.det-col p{ position:relative; color:var(--slate); margin:.4rem 0 0; min-height:3.2em; }
.det-col .idx{ position:relative; color:var(--amber); margin-bottom:.4rem; }
.foot{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:1rem; padding:2rem clamp(1.2rem,4vw,3rem); border-top:1px solid var(--line); color:var(--slate); font-size:.85rem; }

/* ============ PORTRAITS (shared) ============ */
.thumb{ position:relative; display:block; flex:none; width:56px; height:68px; overflow:hidden; background:var(--steel); }
.thumb img{ position:absolute; left:50%; top:-2%; height:auto; max-width:none; filter:grayscale(1) contrast(1.12); }
.thumb.sm{ width:44px; height:56px; }
.thumb.lg{ width:104px; height:128px; }
.det-shot{ position:relative; display:flex; align-items:flex-end; justify-content:center; height:300px; margin:0 -1.4rem 1.2rem; border-bottom:1px solid var(--line); }
.det-shot img{ height:100%; width:auto; max-width:100%; object-fit:contain; object-position:bottom; filter:grayscale(1) contrast(1.12); transition:filter .4s var(--ease); }
.det-col:hover .det-shot img, .det-col:focus-visible .det-shot img{ filter:grayscale(0) contrast(1.05); }
.monogram .port{ position:absolute; left:50%; bottom:0; height:88%; width:auto; max-width:none; transform:translateX(-50%); filter:grayscale(1) contrast(1.15); }
.consult{ display:flex; gap:1rem; align-items:flex-end; margin:0; padding:0 0 0 1.2rem; border-left:3px solid var(--red); }
.consult figcaption{ display:flex; flex-direction:column; gap:.15rem; padding-bottom:.2rem; }
.consult strong{ font-family:var(--display); font-weight:400; font-size:1.8rem; line-height:1; letter-spacing:.03em; }
.consult span{ color:#C9C7C1; font-size:.88rem; }
.det-name{ display:flex; align-items:flex-end; gap:.9rem; }

/* ============ APP SHELL ============ */
.shell{ display:grid; grid-template-columns:284px minmax(0,1fr); min-height:100vh; }
.side{ position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:1.6rem; padding:1.4rem 1.2rem; border-right:1px solid var(--line); background:var(--obsidian); overflow-y:auto; }
.side .case{ color:var(--slate); line-height:1.5; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav a{ display:flex; justify-content:space-between; align-items:center; padding:.6rem .7rem; text-decoration:none; color:#C9C7C1; font-size:.94rem; border-left:3px solid transparent; }
.nav a:hover{ background:var(--charcoal); color:var(--paper); }
.nav a[aria-current="page"]{ border-left-color:var(--red); background:var(--charcoal); color:var(--paper); font-weight:600; }
.nav .sub a{ padding-left:1.6rem; font-size:.88rem; }
.nav-label{ color:var(--slate); font-size:.78rem; padding:.9rem .7rem .3rem; }
.timer{ border:1px solid var(--line); padding:.9rem; }
.timer .clock{ font-family:var(--display); font-size:3rem; line-height:1; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
.timer .row{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
.timer button{ background:none; border:1px solid var(--line); padding:.25rem .55rem; cursor:pointer; font-size:.78rem; }
.timer button:hover{ border-color:var(--slate); }
.meter{ height:4px; background:var(--line); margin-top:.5rem; }
.meter i{ display:block; height:100%; background:var(--paper); }
.mobile-bar{ display:none; }
.main{ min-width:0; padding:clamp(1.4rem,3vw,2.6rem) clamp(1.2rem,3.5vw,3rem) 4rem; }
.page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:2rem; flex-wrap:wrap; padding-bottom:1.6rem; margin-bottom:2rem; border-bottom:1px solid var(--line); }
.page-head h1{ font-family:var(--display); font-weight:400; font-size:clamp(3rem,6vw,5.4rem); line-height:.9; letter-spacing:.02em; }
.page-head p{ color:#C9C7C1; margin:.8rem 0 0; }
.crumbs{ color:var(--slate); margin-bottom:.8rem; }
.crumbs a{ color:var(--slate); } .crumbs a:hover{ color:var(--paper); }
.proto-note{ display:inline-flex; gap:.5rem; align-items:center; color:var(--amber); border:1px dashed rgba(199,154,85,.5); padding:.3rem .6rem; font-size:.78rem; }

/* status labels: text + shape, never colour alone */
.status{ display:inline-flex; align-items:center; gap:.45rem; font-size:.8rem; font-weight:600; white-space:nowrap; }
.status::before{ content:""; width:9px; height:9px; flex:none; }
.st-available::before{ border:1.5px solid var(--paper); }
.st-progress::before{ background:linear-gradient(90deg,var(--amber) 50%, transparent 50%); border:1.5px solid var(--amber); }
.st-progress{ color:var(--amber); }
.st-completed::before{ background:var(--steel-ink); }
.st-completed{ color:var(--steel-ink); }
.st-locked{ color:var(--slate); }
.st-locked::before{ border:1.5px dashed var(--slate); }

/* ============ DASHBOARD ============ */
.stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); margin-bottom:3rem; }
.stat{ padding:1.1rem 1.2rem; border-right:1px solid var(--line); }
.stat:last-child{ border-right:0; }
.stat dt{ color:var(--slate); font-size:.85rem; }
.stat dd{ margin:.2rem 0 0; font-family:var(--display); font-size:2.4rem; line-height:1; }
.stat dd small{ font-family:var(--body); font-size:.8rem; color:var(--slate); margin-left:.3rem; }
.det-sections{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0; border-top:1px solid var(--line); border-left:1px solid var(--line); }
.det-sec{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:1.5rem; }
.det-sec header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1rem; }
.det-sec h2{ font-family:var(--display); font-weight:400; font-size:2.6rem; line-height:1; letter-spacing:.03em; }
.det-sec h2 a{ text-decoration:none; } .det-sec h2 a:hover{ color:var(--amber); }
.rows{ list-style:none; margin:0; padding:0; }
.crow{ display:grid; grid-template-columns:2.4rem minmax(0,1fr) auto auto; gap:1rem; align-items:center; padding:.85rem 0; border-top:1px solid var(--line); }
.crow .num{ font-family:var(--display); font-size:1.6rem; color:var(--slate); }
.crow .t{ font-weight:600; }
.crow .t small{ display:block; font-weight:400; color:var(--slate); font-size:.84rem; }
.crow .go{ text-decoration:none; font-size:.85rem; font-weight:600; border:1px solid var(--line); padding:.45rem .8rem; white-space:nowrap; }
.crow .go:hover{ border-color:var(--paper); }
.crow.locked .t, .crow.locked .num{ opacity:.55; }

/* ============ DETECTIVE PAGE ============ */
.det-hero{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:2rem; align-items:end; margin-bottom:2.5rem; }
.monogram{ width:clamp(120px,16vw,200px); aspect-ratio:3/4; background:var(--steel); position:relative; overflow:hidden; display:flex; align-items:flex-end; }
.monogram span{ font-family:var(--display); font-size:clamp(9rem,15vw,14rem); line-height:.75; color:var(--obsidian); margin-left:-.04em; }
.monogram::after{ content:""; position:absolute; inset:0; }
.slot-list{ border-top:1px solid var(--line); }
.slot{ display:grid; grid-template-columns:5rem minmax(0,1fr) auto; gap:1.5rem; padding:1.6rem 0; border-bottom:1px solid var(--line); align-items:center; }
.slot .big{ font-family:var(--display); font-size:4.2rem; line-height:.8; color:var(--line); -webkit-text-stroke:1px var(--slate); color:transparent; }
.slot h3{ font-family:var(--display); font-weight:400; font-size:2rem; letter-spacing:.03em; line-height:1; }
.slot .meta{ display:flex; gap:1rem; flex-wrap:wrap; margin-top:.5rem; color:var(--slate); }

/* ============ WORKSPACE ============ */
.ws{ display:grid; grid-template-columns:230px minmax(0,1fr) 300px; gap:0; border:1px solid var(--line); }
.ws > *{ min-width:0; }
.ws-left, .ws-right{ background:var(--obsidian); padding:1.2rem; }
.ws-left{ border-right:1px solid var(--line); }
.ws-right{ border-left:1px solid var(--line); }
.ws-center{ background:var(--charcoal); padding:clamp(1.2rem,3vw,2.4rem); }
.ws h1{ font-family:var(--display); font-weight:400; font-size:clamp(2.6rem,4.5vw,3.8rem); line-height:.95; letter-spacing:.02em; margin:.6rem 0 1rem; }
.ws-left h2, .ws-right h2{ font-size:.8rem; color:var(--slate); font-weight:500; margin:0 0 .7rem; }
.ws-left ol{ list-style:none; padding:0; margin:0 0 1.5rem; }
.ws-left li a{ display:flex; gap:.6rem; padding:.5rem .4rem; text-decoration:none; font-size:.9rem; border-left:3px solid transparent; }
.ws-left li a[aria-current="page"]{ border-left-color:var(--red); background:var(--charcoal); font-weight:600; }
.ws-left li a:hover{ background:var(--charcoal); }
.ws-left li .n{ color:var(--slate); font-family:var(--mono); font-size:.8rem; padding-top:.15rem; }
.ws-id{ display:flex; gap:.8rem; align-items:center; margin-bottom:1.4rem; }
.ws-id .mini{ width:44px; height:56px; background:var(--steel); display:flex; align-items:flex-end; overflow:hidden; }
.ws-id .mini span{ font-family:var(--display); font-size:3.6rem; line-height:.75; color:var(--obsidian); }
.story{ border-left:3px solid var(--amber); padding:.2rem 0 .2rem 1rem; color:#D8D6D0; margin:1.4rem 0; }
.stage{ border:1px dashed #4A4B52; min-height:200px; display:grid; place-items:center; text-align:center; padding:2rem; margin:1.4rem 0; background:var(--obsidian); }
.stage p{ color:var(--slate); margin:0 auto; max-width:38ch; }
.field label{ display:block; font-weight:600; margin-bottom:.4rem; }
.field .help{ color:var(--slate); font-size:.85rem; margin-top:.4rem; }
.input{ width:100%; background:var(--obsidian); border:1px solid var(--line); padding:.8rem .9rem; min-height:48px; font-family:var(--mono); font-size:1rem; transition:border-color .15s; }
.input:hover{ border-color:#4A4B52; }
.input:focus{ outline:none; border-color:var(--paper); box-shadow:0 0 0 1px var(--paper); }
.input[aria-invalid="true"]{ border-color:var(--red-ink); box-shadow:0 0 0 1px var(--red-ink); }
textarea.input{ font-family:var(--body); min-height:160px; resize:vertical; line-height:1.6; }
.err{ color:var(--red-ink); font-size:.88rem; margin-top:.4rem; }
.actions{ display:flex; flex-wrap:wrap; gap:.8rem; align-items:center; margin-top:1.2rem; }
.feedback{ margin-top:1.4rem; padding:1rem 1.1rem; border:1px solid var(--line); display:grid; grid-template-columns:auto minmax(0,1fr); gap:.9rem; align-items:start; }
.feedback .glyph{ font-family:var(--display); font-size:1.5rem; line-height:1; }
.feedback h3{ font-size:1rem; margin:0 0 .2rem; }
.feedback p{ margin:0; color:#C9C7C1; font-size:.92rem; }
.fb-success{ border-color:var(--steel); background:rgba(83,109,154,.12); } .fb-success .glyph{ color:var(--steel-ink); }
.fb-error{ border-color:var(--red); background:rgba(184,39,45,.1); } .fb-error .glyph{ color:var(--red-ink); }
.fb-hint{ border-color:var(--amber); background:rgba(199,154,85,.08); } .fb-hint .glyph{ color:var(--amber); }
.fb-neutral .glyph{ color:var(--slate); }
.fb-locked{ border-style:dashed; }
.spinner{ width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg) } }
.state-preview{ margin-top:2.4rem; padding-top:1.2rem; border-top:1px dashed var(--line); }
.seg{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
.seg button{ background:var(--obsidian); border:1px solid var(--line); padding:.4rem .7rem; font-size:.8rem; cursor:pointer; }
.seg button[aria-pressed="true"]{ border-color:var(--paper); background:var(--paper); color:var(--obsidian); font-weight:600; }
.fact-list{ list-style:none; padding:0; margin:0 0 1.6rem; }
.fact-list li{ padding:.6rem 0; border-top:1px solid var(--line); font-size:.9rem; }
.fact-list .mono{ color:var(--amber); display:block; }
.ref{ border:1px dashed var(--line); padding:.9rem; color:var(--slate); font-size:.88rem; }

/* ============ BRIEFING ============ */
.dossier{ display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:0; border:1px solid var(--line); margin-bottom:4rem; }
.dossier .narr{ background:var(--paper); color:var(--obsidian); padding:clamp(1.6rem,4vw,3rem); position:relative; }
.dossier .narr .stamp{ position:absolute; top:1.4rem; right:1.4rem; border:2px solid var(--red); color:var(--red); padding:.2rem .6rem; font-family:var(--display); font-size:1.3rem; letter-spacing:.08em; transform:rotate(4deg); }
.dossier .narr h2{ font-family:var(--display); font-weight:400; font-size:clamp(2.4rem,4vw,3.4rem); line-height:.95; margin-bottom:1.2rem; max-width:12ch; }
.dossier .narr p{ font-size:1.05rem; line-height:1.7; }
.dossier .tlside{ padding:clamp(1.6rem,4vw,2.6rem); }
.vtl{ list-style:none; margin:1rem 0 0; padding:0; position:relative; }
.vtl::before{ content:""; position:absolute; left:6px; top:8px; bottom:8px; width:1px; background:var(--line); }
.vtl li{ position:relative; padding:0 0 1.5rem 1.8rem; }
.vtl li::before{ content:""; position:absolute; left:0; top:6px; width:13px; height:13px; background:var(--paper); }
.vtl li.crit::before{ background:var(--red); }
.vtl li.pending::before{ background:transparent; border:1px dashed var(--slate); }
.vtl .time{ font-family:var(--display); font-size:1.7rem; line-height:1; letter-spacing:.03em; }
.vtl li.crit .time{ color:var(--red-ink); }
.vtl li.pending{ color:var(--slate); }
.tag{ display:inline-block; font-size:.74rem; padding:.1rem .45rem; border:1px solid currentColor; margin-left:.5rem; vertical-align:middle; font-weight:600; }
.tag-confirmed{ color:var(--steel-ink); } .tag-sample{ color:var(--amber); border-style:dashed; }
.board{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-left:1px solid var(--line); border-top:1px solid var(--line); }
.suspect{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; flex-direction:column; }
.suspect .plate{ aspect-ratio:4/5; background:var(--charcoal); position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:1rem; }
.suspect .plate .ini{ position:absolute; top:-.12em; left:-.05em; font-family:var(--display); font-size:9rem; line-height:1; color:var(--charcoal-2); }
.suspect .plate .no{ position:relative; font-family:var(--mono); font-size:.78rem; color:var(--slate); }
.suspect .body{ padding:1rem; display:flex; flex-direction:column; gap:.4rem; flex:1; }
.suspect h3{ font-family:var(--display); font-weight:400; font-size:1.9rem; letter-spacing:.03em; line-height:1; }
.suspect .role{ color:#C9C7C1; font-size:.9rem; }
.suspect .motive{ font-size:.85rem; color:var(--slate); margin-top:auto; padding-top:.6rem; border-top:1px solid var(--line); }
.suspect .motive b{ color:var(--amber); font-weight:600; display:block; }
.suspect button{ margin-top:.6rem; }

/* ============ EVIDENCE ============ */
.filters{ display:flex; flex-wrap:wrap; gap:1rem; align-items:center; margin-bottom:1.4rem; }
.search{ flex:1 1 260px; position:relative; }
.search input{ padding-left:2.4rem; font-family:var(--body); }
.search svg{ position:absolute; left:.8rem; top:50%; transform:translateY(-50%); width:16px; stroke:var(--slate); }
.chips{ display:flex; flex-wrap:wrap; gap:.4rem; }
.chip{ background:none; border:1px solid var(--line); padding:.4rem .75rem; font-size:.84rem; cursor:pointer; min-height:36px; }
.chip:hover{ border-color:var(--slate); }
.chip[aria-pressed="true"]{ border-color:var(--amber); color:var(--amber); font-weight:600; }
.ev-list{ list-style:none; margin:0 0 4rem; padding:0; border-top:1px solid var(--line); }
.ev{ width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:5.5rem minmax(0,1fr) 11rem 9rem; gap:1.2rem; padding:1.1rem .6rem; cursor:pointer; align-items:center; }
.ev:hover{ background:var(--charcoal); }
.ev[aria-expanded="true"]{ background:var(--charcoal); box-shadow:inset 3px 0 0 var(--amber); }
.ev .id{ font-family:var(--mono); color:var(--amber); font-size:.85rem; }
.ev .ttl{ font-weight:600; }
.ev .ttl small{ display:block; color:var(--slate); font-weight:400; font-size:.86rem; margin-top:.15rem; }
.ev .cat{ color:#C9C7C1; font-size:.86rem; }
.empty{ padding:3rem 1rem; text-align:center; color:var(--slate); }
.drawer-scrim{ position:fixed; inset:0; background:rgba(10,10,11,.6); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s; }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--charcoal); border-left:1px solid var(--line); z-index:41; transform:translateX(100%); transition:transform .3s var(--ease); overflow-y:auto; padding:calc(1.6rem + env(safe-area-inset-top,0px)) 1.6rem calc(2rem + env(safe-area-inset-bottom,0px)); visibility:hidden; }
.drawer.open{ transform:none; visibility:visible; }
.drawer-scrim.open{ opacity:1; pointer-events:auto; }
.drawer .close{ position:absolute; top:calc(1rem + env(safe-area-inset-top,0px)); right:1rem; background:none; border:1px solid var(--line); width:40px; height:40px; cursor:pointer; font-size:1.2rem; }
.drawer h2{ font-family:var(--display); font-weight:400; font-size:2.8rem; line-height:.95; letter-spacing:.02em; margin:.6rem 0 1rem; padding-right:3rem; }
.kv{ display:grid; grid-template-columns:8.5rem minmax(0,1fr); border-top:1px solid var(--line); margin:1.4rem 0; }
.kv dt, .kv dd{ padding:.6rem 0; border-bottom:1px solid var(--line); margin:0; font-size:.9rem; }
.kv dt{ color:var(--slate); }
.hl{ display:flex; gap:.6rem; align-items:center; }

/* ============ FINAL DEDUCTION ============ */
.fd{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:2.4rem; align-items:start; }
.step{ margin-bottom:2.8rem; }
.step-h{ display:flex; align-items:baseline; gap:1rem; margin-bottom:1rem; }
.step-h .n{ font-family:var(--display); font-size:2.4rem; color:var(--red-ink); line-height:1; }
.step-h h2{ font-family:var(--display); font-weight:400; font-size:2rem; letter-spacing:.03em; }
.step-h .req{ color:var(--slate); font-size:.85rem; margin-left:auto; }
.pick{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; border:0; padding:0; margin:0; }
.pick label{ position:relative; display:flex; flex-direction:column; justify-content:flex-end; min-height:180px; padding:.9rem; background:var(--charcoal); border:1px solid var(--line); cursor:pointer; overflow:hidden; transition:border-color .15s, background .15s; }
.pick label:hover{ border-color:var(--slate); }
.pick input{ position:absolute; opacity:0; }
.pick .ini{ position:absolute; top:-.1em; right:-.04em; font-family:var(--display); font-size:6.5rem; line-height:1; color:var(--charcoal-2); }
.pick .nm{ position:relative; font-family:var(--display); font-size:1.6rem; line-height:1; letter-spacing:.02em; }
.pick .rl{ position:relative; font-size:.8rem; color:var(--slate); margin-top:.3rem; }
.pick .sel{ position:relative; font-size:.75rem; font-weight:700; color:var(--paper); margin-top:.6rem; visibility:hidden; }
.pick input:checked + label, .pick label:has(input:checked){ border-color:var(--red); background:#1E1214; box-shadow:inset 0 0 0 1px var(--red); }
.pick label:has(input:checked) .sel{ visibility:visible; }
.pick label:has(input:focus-visible){ outline:2px solid var(--amber); outline-offset:3px; }
.ev-pick{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.ev-pick label{ display:grid; grid-template-columns:22px 5rem minmax(0,1fr); gap:1rem; align-items:center; padding:.8rem .4rem; border-bottom:1px solid var(--line); cursor:pointer; }
.ev-pick label:hover{ background:var(--charcoal); }
.ev-pick input{ width:18px; height:18px; accent-color:var(--red); }
.summary{ position:sticky; top:1.4rem; border:1px solid var(--line); background:var(--charcoal); padding:1.4rem; }
.summary h2{ font-family:var(--display); font-weight:400; font-size:1.9rem; letter-spacing:.03em; margin-bottom:.8rem; }
.check{ list-style:none; padding:0; margin:0 0 1.2rem; }
.check li{ display:flex; gap:.7rem; padding:.6rem 0; border-top:1px solid var(--line); font-size:.9rem; }
.check .box{ width:16px; height:16px; flex:none; border:1.5px solid var(--slate); margin-top:3px; display:grid; place-items:center; font-size:.7rem; }
.check li.ok .box{ background:var(--paper); border-color:var(--paper); color:var(--obsidian); }
.check li.ok{ color:var(--paper); } .check li{ color:var(--slate); }

dialog{ background:var(--charcoal); color:var(--paper); border:1px solid var(--line); padding:0; width:min(560px,calc(100% - 2rem)); max-height:85vh; }
dialog::backdrop{ background:rgba(10,10,11,.75); }
.dlg-in{ padding:1.8rem; }
.dlg-in h2{ font-family:var(--display); font-weight:400; font-size:2.6rem; line-height:.95; letter-spacing:.02em; margin-bottom:1rem; padding-right:2.5rem; }
.dlg-x{ position:absolute; top:.9rem; right:.9rem; background:none; border:1px solid var(--line); width:38px; height:38px; cursor:pointer; font-size:1.1rem; }
.dlg-in .actions{ justify-content:flex-end; }
@media (prefers-reduced-motion: no-preference){ dialog[open]{ animation:pop .2s var(--ease); } @keyframes pop{ from{ opacity:0; transform:translateY(8px) } } }

/* ============ RESULTS ============ */
.closed{ position:relative; border:1px solid var(--line); padding:clamp(2rem,6vw,4.5rem); overflow:hidden; margin-bottom:2.4rem; }
.closed .display{ font-size:clamp(3.6rem,9vw,8rem); max-width:9ch; }
.closed .stampbig{ position:absolute; right:clamp(1rem,5vw,4rem); top:50%; transform:translateY(-50%) rotate(-8deg); border:4px solid var(--red); color:var(--red-ink); font-family:var(--display); font-size:clamp(2rem,5vw,4rem); padding:.3rem 1.2rem; letter-spacing:.08em; opacity:.9; }
.ticks{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; margin:1rem 0 2.4rem; }
.tick{ border:1px solid var(--line); padding:.8rem .6rem; }
.tick .k{ font-family:var(--display); font-size:1.8rem; line-height:1; }
.tick.done{ background:var(--charcoal); border-color:var(--steel); }
.res-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line); }
.res-grid > div{ padding:1.6rem; }
.res-grid > div + div{ border-left:1px solid var(--line); }

/* ============ PUZZLE CONTENT ============ */
blockquote.story{ margin:1.2rem 0 1.4rem; }
.prompt p{ max-width:68ch; }
.lines{ line-height:1.9; }
.mono-block{ display:inline-block; font-family:var(--mono); font-size:1.05rem; letter-spacing:.04em; background:var(--obsidian); border:1px solid var(--line); padding:.55rem .85rem; }
pre.code{ background:var(--obsidian); border:1px solid var(--line); padding:1rem 1.2rem; margin:1rem 0 1.2rem; overflow-x:auto; font:.92rem/1.65 var(--mono); tab-size:4; color:#E4E2DC; }
.grid-wrap{ overflow-x:auto; margin:.4rem 0 1.4rem; }
table.grid{ border-collapse:collapse; font-family:var(--mono); }
table.grid th, table.grid td{ border:1px solid var(--line); min-width:3rem; height:2.6rem; text-align:center; padding:0 .4rem; }
table.grid thead th, table.grid tbody th{ color:var(--amber); font-weight:500; background:var(--obsidian); }
table.grid td{ font-size:1.05rem; }
.q-label{ font-size:.8rem; font-weight:500; margin-top:1.8rem; }
.question{ font-size:1.25rem; font-weight:600; margin:.2rem 0 1.4rem; }
.input.locked-in{ border-style:dashed; background:var(--charcoal-2); color:var(--paper); }
.receipt{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:1rem; align-items:start; border:1px solid var(--line); background:var(--obsidian); padding:1rem 1.1rem; margin-top:1rem; }
.receipt .lock{ font-family:var(--mono); font-size:.7rem; letter-spacing:.06em; border:1px solid var(--slate); padding:.15rem .45rem; }
.receipt p{ margin:.25rem 0 0; color:#C9C7C1; font-size:.92rem; }
.hintbox{ margin-top:2.2rem; padding-top:1.2rem; border-top:1px dashed var(--line); }
.hintbox h3{ font-size:.95rem; margin-bottom:.3rem; }
.hintbox p{ color:#C9C7C1; font-size:.9rem; }
.answer-preview{ font-family:var(--mono); font-size:1.2rem; background:var(--obsidian); border:1px solid var(--line); padding:.7rem .9rem; white-space:pre-wrap; word-break:break-word; }
.fd{ grid-template-columns:minmax(0,1fr) 300px; }

/* ============ STEP NAVIGATION ============ */
.nav .sl{ display:flex; align-items:baseline; gap:.6rem; white-space:nowrap; }
.nav a{ gap:.75rem; }
.nav a > .mono{ font-size:.74rem; white-space:nowrap; }
.nav .sn{ font-family:var(--mono); font-size:.72rem; color:var(--slate); width:1.3rem; flex:none; }
.nav a[aria-current="page"] .sn{ color:var(--red-ink); }
.nav .sub a{ padding-left:2.6rem; }
.nav .start{ color:var(--amber); }
.nav-label{ border-top:1px solid var(--line); margin-top:.6rem; }
.nav-label:first-child{ border-top:0; margin-top:0; }
.pager{ display:flex; gap:1rem; flex-wrap:wrap; margin-top:3.5rem; padding-top:1.4rem; border-top:1px solid var(--line); }
.pager a{ display:flex; flex-direction:column; gap:.2rem; min-width:220px; padding:.8rem 1.1rem; border:1px solid var(--line); text-decoration:none; transition:border-color .2s, background .2s; }
.pager a:hover{ border-color:var(--paper); background:var(--charcoal); }
.pager .next{ margin-left:auto; text-align:right; border-color:var(--paper); }
.pager small{ font-family:var(--mono); font-size:.74rem; color:var(--slate); }
.pager strong{ font-family:var(--display); font-weight:400; font-size:1.7rem; line-height:1; letter-spacing:.03em; }

/* ============ FIELD CARD (locked case) ============ */
.field-card{ position:relative; overflow:hidden; display:grid; grid-template-columns:auto minmax(0,1fr); gap:1.4rem; align-items:center; padding:1.2rem; border:1px dashed #4A4B52; background:var(--obsidian); }
.field-card::before{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.55;
  background-image:radial-gradient(circle, rgba(240,238,233,.45) 1px, transparent 1.6px), radial-gradient(circle, rgba(240,238,233,.25) 1px, transparent 1.4px);
  background-size:38px 38px, 23px 23px; animation:snowfall 8s linear infinite; }
@keyframes snowfall{ from{ background-position:0 0, 11px 0; } to{ background-position:-38px 380px, 34px 230px; } }
.field-card > *{ position:relative; }
.field-card::after{ content:""; position:absolute; left:0; right:0; top:0; height:1px; background:var(--red); opacity:.7; animation:scan 3s ease-in-out infinite alternate; }
@keyframes scan{ to{ top:calc(100% - 1px); } }
.signal{ display:flex; align-items:flex-end; gap:5px; height:56px; padding:0 .4rem; }
.signal i{ width:7px; background:var(--slate); animation:sig 1.8s ease-in-out infinite; }
.signal i:nth-child(1){ height:25%; } .signal i:nth-child(2){ height:50%; animation-delay:.15s; }
.signal i:nth-child(3){ height:75%; animation-delay:.3s; } .signal i:nth-child(4){ height:100%; animation-delay:.45s; }
@keyframes sig{ 0%,100%{ opacity:.25; } 30%{ opacity:1; background:var(--paper); } }
.fc-tag{ display:inline-flex; align-items:center; gap:.5rem; color:var(--red-ink); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; }
.pulse{ width:8px; height:8px; border-radius:50%; background:var(--red); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 50%{ opacity:.2; } }
.fc-line{ font-family:var(--display); font-size:1.8rem; line-height:1.02; letter-spacing:.02em; margin:.45rem 0 .5rem; max-width:24ch; }
.fc-eta{ color:var(--slate); margin:0; }
.dots i{ font-style:normal; animation:blink 1.4s infinite; }
.dots i:nth-child(2){ animation-delay:.2s; } .dots i:nth-child(3){ animation-delay:.4s; }
@keyframes blink{ 0%,80%,100%{ opacity:.15; } 40%{ opacity:1; } }
.field-card.compact{ padding:1rem; gap:1.1rem; }
.field-card.compact .signal{ height:40px; }
.field-card.compact .fc-line{ font-size:1.35rem; }
.field-card.big{ padding:1.6rem; margin-bottom:1rem; }
.field-card.big .fc-line{ font-size:clamp(2rem,3.6vw,3rem); }
.monogram.away .port{ filter:grayscale(1) brightness(.4); }
@media (max-width:600px){ .field-card{ grid-template-columns:1fr; } }

/* ============ CLOCK, FORMATS, VERDICT ============ */
.tb-msg{ margin:.6rem 0 0; font-size:.8rem; line-height:1.45; color:#C9C7C1; }
.proto-ctl{ display:flex; flex-direction:column; gap:.5rem; align-items:flex-start; }
.proto-ctl .seg{ margin:0; }
.mobile-bar .mono{ font-size:1rem; }
.sec-cd{ color:var(--amber); }
.reading{ display:flex; gap:1.6rem; align-items:center; flex-wrap:wrap; border:1px solid var(--amber); background:rgba(199,154,85,.07); padding:1rem 1.2rem; margin-bottom:2rem; }
.reading strong{ display:block; font-family:var(--display); font-weight:400; font-size:2.6rem; line-height:1; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
.reading p{ margin:0; color:#C9C7C1; max-width:52ch; }
.reading.done{ border-color:var(--line); background:none; justify-content:space-between; }
.wait{ margin-top:1.2rem; color:#C9C7C1; }
.fmt{ display:flex; gap:.7rem; align-items:baseline; flex-wrap:wrap; margin-bottom:.9rem; padding:.55rem .8rem; border-left:3px solid var(--steel); background:rgba(83,109,154,.12); }
.fmt-k{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--steel-ink); }
.fmt-v{ font-weight:600; }
.field .lbl{ display:block; font-weight:600; margin-bottom:.4rem; }
.affix{ display:flex; align-items:stretch; border:1px solid var(--line); background:var(--obsidian); }
.affix:hover{ border-color:#4A4B52; }
.affix:focus-within{ border-color:var(--paper); box-shadow:0 0 0 1px var(--paper); }
.affix:has([aria-invalid="true"]){ border-color:var(--red-ink); box-shadow:0 0 0 1px var(--red-ink); }
.affix .input{ border:0; box-shadow:none !important; flex:1; min-width:0; }
.affix .suf, .affix .pre{ display:flex; align-items:center; padding:0 .9rem; font-family:var(--mono); font-size:.9rem; color:var(--slate); white-space:nowrap; }
.affix .suf{ border-left:1px solid var(--line); }
.affix.term .pre{ color:var(--amber); padding-right:.1rem; }
.time-in{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; border:0; padding:0; margin:0; }
.time-in .tbox{ width:4.4rem; text-align:center; font-size:1.3rem; }
.time-in .colon{ font-family:var(--display); font-size:2.2rem; line-height:1; color:var(--slate); }
.ampm{ display:flex; margin-left:.6rem; border:1px solid var(--line); }
.ampm label{ position:relative; cursor:pointer; }
.ampm label + label{ border-left:1px solid var(--line); }
.ampm input{ position:absolute; opacity:0; }
.ampm span{ display:block; padding:.75rem 1rem; font-family:var(--mono); font-weight:500; }
.ampm label:hover span{ background:var(--charcoal-2); }
.ampm label:has(input:checked) span{ background:var(--paper); color:var(--obsidian); }
.ampm label:has(input:focus-visible) span{ outline:2px solid var(--amber); outline-offset:2px; }
.verdict{ position:relative; overflow:hidden; border:1px solid var(--line); background:var(--charcoal); padding:clamp(1.6rem,4vw,3rem); margin:1.6rem 0 2.6rem; }
.verdict::before{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.6;
  background-image:radial-gradient(circle, rgba(240,238,233,.45) 1px, transparent 1.6px), radial-gradient(circle, rgba(240,238,233,.25) 1px, transparent 1.4px);
  background-size:38px 38px, 23px 23px; animation:snowfall 8s linear infinite; }
.verdict > *{ position:relative; }
.vd-tag{ color:var(--amber); font-size:.76rem; letter-spacing:.08em; text-transform:uppercase; }
.verdict h2{ font-size:clamp(3rem,7vw,6rem); margin:.5rem 0 .9rem; animation:settle 1.6s var(--ease) both; }
@keyframes settle{ from{ opacity:0; letter-spacing:.25em; filter:blur(6px); } }
.verdict p{ color:#C9C7C1; font-size:1.05rem; max-width:52ch; }
.ws-center .verdict{ margin-top:1.4rem; }
.ws-center .verdict h2{ font-size:clamp(2.4rem,4.2vw,3.6rem); }

/* ============ SET D CONTENT ============ */
ol.sign{ margin:.2rem 0 1.2rem; padding-left:1.6rem; line-height:1.9; font-family:var(--mono); font-size:.95rem; }
table.grid.horiz th[scope="row"]{ text-align:left; padding:0 .7rem; }
table.grid td, table.grid th{ white-space:nowrap; }
/* Horizontal tables (keypad, zone bits) must fit the column: a hidden column is a hidden clue */
table.grid.horiz{ font-size:.9rem; }
.prompt{ container-type:inline-size; }
.dual > .grid-wrap:last-child{ display:none; }
@container (max-width: 700px){
  .dual > .grid-wrap:first-child{ display:none; }
  .dual > .grid-wrap:last-child{ display:block; }
}
.choice{ display:flex; flex-wrap:wrap; gap:8px; border:0; padding:0; margin:0; }
.choice label{ position:relative; cursor:pointer; }
.choice input{ position:absolute; opacity:0; }
.choice span{ display:block; min-width:13rem; padding:1rem 1.2rem; border:1px solid var(--line); background:var(--obsidian); font-family:var(--display); font-size:1.6rem; letter-spacing:.03em; line-height:1; transition:border-color .15s; }
.choice label:hover span{ border-color:var(--slate); }
.choice label:has(input:checked) span{ border-color:var(--paper); box-shadow:inset 0 0 0 1px var(--paper); background:var(--charcoal-2); }
.choice label:has(input:focus-visible) span{ outline:2px solid var(--amber); outline-offset:3px; }
.handoff{ margin-top:1.6rem; }
.handoff .mono{ display:block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; margin-bottom:.3rem; }

/* ============ SUSPECT MUGSHOTS ============ */
.mug{ display:block; width:100%; height:100%; }
.suspect .plate{ padding:0; }
.suspect .plate .no{ position:absolute; top:.7rem; right:.7rem; background:var(--obsidian); padding:.15rem .45rem; border:1px solid var(--line); }
.suspect .plate .mug{ position:absolute; inset:0; filter:grayscale(.15); transition:filter .3s var(--ease); }
.suspect:hover .plate .mug{ filter:none; }
.suspect .motive.why{ margin-top:0; }
.profile{ display:grid; grid-template-columns:120px minmax(0,1fr); gap:1.2rem; align-items:end; margin-bottom:.4rem; padding-right:2.5rem; }
.profile-shot{ aspect-ratio:4/5; border:1px solid var(--line); overflow:hidden; }
.profile h2{ margin:.3rem 0 .5rem !important; padding-right:0 !important; }
.pick-shot{ position:absolute; inset:0; opacity:.55; transition:opacity .2s; }
.pick-shot::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 35%, var(--charcoal) 88%); }
.pick label:hover .pick-shot, .pick label:has(input:checked) .pick-shot{ opacity:.85; }
.pick label{ min-height:230px; }
@media (max-width:600px){ .profile{ grid-template-columns:88px minmax(0,1fr); } }

/* ============ ARCHIVAL TEXTURE ============
   One static layer BEHIND all content (z-index 0; the app sits at z-index 1).
   Intensity is set per page type through body[data-tex]; nothing here animates. */
body{ position:relative; min-height:100vh; }
#app{ position:relative; z-index:1; }

/* ============ SIGNATURE MOTIF ============
   Behind content: z-index -1 inside its section, clipped to that section, no pointer events, static. */
.main, .page-head, .pager, .res-sealed{ position:relative; }
/* Small screens stack these areas full-width, so there is no empty space to hold a whole smile: hide it. */
@media (max-width:760px){ .motif-clip{ display:none; } }
/* The Results box narrows on laptops; show its smile only when the box leaves clear space for it. */
.res-sealed{ container-type:inline-size; }
@container (max-width: 420px){ .res-sealed > .motif-clip{ display:none; } }
.motif-clip{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:-1; }
.motif{ position:absolute; aspect-ratio:var(--motif-ratio); background:var(--motif-ink);
  -webkit-mask:var(--motif-src) center / contain no-repeat, radial-gradient(circle, #000 .75px, transparent 1.1px) 0 0 / 2.5px 2.5px;
  -webkit-mask-composite:source-in;
          mask:var(--motif-src) center / contain no-repeat, radial-gradient(circle, #000 .75px, transparent 1.1px) 0 0 / 2.5px 2.5px;
          mask-composite:intersect; }

/* ============ RESPONSIVE ============ */
@media (max-width:1180px){
  .ws{ grid-template-columns:minmax(0,1fr) 280px; }
  .ws-left{ display:none; }
  .board{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .pick{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .fd{ grid-template-columns:1fr; }
  .summary{ position:static; }
}
@media (max-width:960px){
  .hero{ grid-template-columns:1fr; }
  .hero-copy{ padding-top:6rem; }
  .hero-mark{ margin-right:0; }
  .panels{ min-height:auto; height:620px; padding:0 10px 10px; }
  .case-intro{ grid-template-columns:1fr; }
  .detective-strip{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .det-col{ min-height:280px; border-bottom:1px solid var(--line); }
  .det-shot{ height:220px; }
  .shell{ grid-template-columns:1fr; }
  .side{ position:fixed; z-index:50; width:min(300px,86vw); top:0; bottom:0; height:auto; transform:translateX(-100%); transition:transform .25s var(--ease); padding-top:calc(1.4rem + env(safe-area-inset-top,0px)); visibility:hidden; }
  .side.open{ transform:none; visibility:visible; }
  .mobile-bar{ display:flex; justify-content:space-between; align-items:center; gap:1rem; position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--obsidian); border-bottom:1px solid var(--line); padding:.8rem 1.2rem; }
  .mobile-bar button{ background:none; border:1px solid var(--line); min-height:40px; padding:0 .9rem; cursor:pointer; }
  .stats{ grid-template-columns:1fr 1fr; }
  .stat:nth-child(2){ border-right:0; } .stat:nth-child(-n+2){ border-bottom:1px solid var(--line); }
  .det-sections{ grid-template-columns:1fr; }
  .ws{ grid-template-columns:1fr; }
  .ws-right{ border-left:0; border-top:1px solid var(--line); }
  .dossier{ grid-template-columns:1fr; }
  .ev{ grid-template-columns:4.5rem minmax(0,1fr); }
  .ev .cat, .ev .vs{ grid-column:2; }
  .res-grid{ grid-template-columns:1fr; } .res-grid > div + div{ border-left:0; border-top:1px solid var(--line); }
  .ticks{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  .closed .stampbig{ position:static; transform:rotate(-4deg); display:inline-block; margin-top:1.4rem; }
}
@media (max-width:600px){
  .topbar nav{ display:none; }
  .board, .pick{ grid-template-columns:1fr 1fr; }
  .crow{ grid-template-columns:2rem minmax(0,1fr); }
  .crow .status, .crow .go{ grid-column:2; justify-self:start; }
  .slot{ grid-template-columns:3rem minmax(0,1fr); } .slot .btn{ grid-column:2; justify-self:start; }
  .slot .big{ font-size:3rem; }
  .facts{ grid-template-columns:1fr; }
  .det-hero{ grid-template-columns:1fr; }
}
/* ============ LOGIN SCREEN ============ */
.login-screen{ min-height:100vh; display:grid; place-items:center; padding:2rem 1.4rem; position:relative; z-index:2; }
.login-card{ width:min(440px,100%); background:var(--charcoal); border:1px solid var(--line); padding:clamp(2rem,5vw,2.8rem); box-shadow:0 24px 60px rgba(0,0,0,.6); position:relative; }
.login-header{ margin-bottom:2rem; }
.login-header .wordmark{ font-size:2rem; margin-bottom:.6rem; display:block; }
.login-header p{ color:var(--slate); font-size:.9rem; line-height:1.5; margin:0; }
.login-card .field{ margin-bottom:1.5rem; }
.login-card .btn{ width:100%; justify-content:center; }

/* ============ FULLSCREEN BLOCKER & INITIATION ============ */
.fs-blocker{ position:fixed; inset:0; z-index:999999; background:var(--obsidian); display:grid; place-items:center; text-align:center; padding:2rem; }
.fs-blocker[hidden], .fs-entry-modal[hidden], #fs-unblock-action[hidden]{ display:none !important; }
.fs-blocker-content{ max-width:480px; width:100%; padding:2.5rem; background:var(--charcoal); border:1px solid var(--red); box-shadow:0 0 50px rgba(184,39,45,.25); }
.fs-blocker-msg{ font-family:var(--mono); font-size:1.15rem; line-height:1.8; color:var(--paper); margin:0 0 1.5rem; text-transform:none; }
.fs-entry-modal{ position:fixed; inset:0; z-index:99999; background:rgba(10,10,11,.88); display:grid; place-items:center; padding:1.5rem; backdrop-filter:blur(4px); }
.fs-entry-card{ max-width:500px; width:100%; background:var(--charcoal); border:1px solid var(--amber); padding:2rem; text-align:center; }
.fs-entry-card h2{ font-size:2.6rem; margin:.6rem 0 1rem; }
.fs-entry-card p{ color:#C9C7C1; margin-bottom:1.6rem; }
.fs-entry-card .btn{ width:100%; justify-content:center; }

/* ============ ADMIN CONSOLE ============ */
.admin-shell{ max-width:1200px; margin:0 auto; padding:2.5rem clamp(1rem,4vw,2.5rem); }
.admin-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1.2rem; border-bottom:1px solid var(--line); padding-bottom:1.4rem; margin-bottom:2rem; }
.admin-tabs{ display:flex; gap:.6rem; margin-bottom:2rem; border-bottom:1px solid var(--line); }
.admin-tab-btn{ background:none; border:none; border-bottom:2px solid transparent; color:var(--slate); font-family:var(--display); font-size:1.4rem; letter-spacing:.04em; padding:.6rem 1.2rem; cursor:pointer; }
.admin-tab-btn:hover{ color:var(--paper); }
.admin-tab-btn[aria-selected="true"]{ color:var(--paper); border-color:var(--amber); }
.admin-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1.4rem; margin-bottom:2rem; }
.admin-card{ background:var(--charcoal); border:1px solid var(--line); padding:1.4rem; }
.admin-table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:.88rem; margin-top:1rem; }
.admin-table th, .admin-table td{ padding:.75rem .9rem; text-align:left; border-bottom:1px solid var(--line); }
.admin-table th{ color:var(--amber); font-weight:500; font-size:.8rem; letter-spacing:.05em; text-transform:uppercase; }
.admin-table tr:hover td{ background:rgba(255,255,255,.02); }
.badge{ display:inline-block; padding:.2rem .5rem; font-size:.72rem; letter-spacing:.05em; font-family:var(--mono); text-transform:uppercase; border:1px solid; }
.badge-active{ color:var(--steel-ink); border-color:var(--steel); }
.badge-blocked{ color:var(--red-ink); border-color:var(--red); }
.lobby-lock{ border:1px dashed var(--amber); background:rgba(199,154,85,.06); padding:2rem; text-align:center; margin:2rem 0; }
</style>
</head>

<div class="tex" aria-hidden="true"></div>
<div id="app"></div>
<div id="fs-blocker" class="fs-blocker" hidden role="alert" aria-live="assertive">
  <div class="fs-blocker-content">
    <p class="fs-blocker-msg" id="fs-blocker-text">fullscreen mode exited<br>Inform an admin to get unblocked</p>
    <div id="fs-unblock-action" hidden>
      <button type="button" class="btn btn-red" id="fs-reenter-btn">Re-enter Fullscreen</button>
    </div>
  </div>
</div>
<div id="fs-entry" class="fs-entry-modal" hidden role="dialog" aria-modal="true" aria-labelledby="fs-entry-title">
  <div class="fs-entry-card">
    <div class="mono muted">CBI / INCIDENT DISPATCH</div>
    <h2 id="fs-entry-title" class="display">INVESTIGATION COMMENCED</h2>
    <p>The case clock is now running simultaneously across all terminals. Secure full-screen mode is required to proceed.</p>
    <button type="button" class="btn btn-red" id="fs-start-btn">ENTER FULLSCREEN &amp; BEGIN</button>
  </div>
</div>
<dialog id="dlg" aria-labelledby="dlg-title"><div id="dlg-body"></div></dialog>

/* ============ LIVE API CLIENT ============ */
const API = {
  async request(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (S.user && S.user.token) {
      headers['Authorization'] = `Bearer ${S.user.token}`;
    }
    try {
      const res = await fetch(endpoint, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    } catch (err) {
      console.warn(`[API REQUEST] ${endpoint}:`, err.message);
      if (endpoint === '/api/submissions') {
        return { status: 'recorded', recorded_at: new Date().toISOString() };
      }
      if (endpoint === '/api/hints') {
        return { status: 'logged', recorded_at: new Date().toISOString(), hint: null };
      }
      if (endpoint === '/api/accusation') {
        return { status: 'recorded', recorded_at: new Date().toISOString() };
      }
      if (endpoint === '/api/clock/sync') {
        return { server_time: Date.now() };
      }
      if (endpoint.startsWith('/api/fullscreen')) {
        return { success: true };
      }
      if (endpoint.startsWith('/api/admin/reset')) {
        return { success: true };
      }
      throw err;
    }
  },
  login(register_number) {
    return this.request('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ register_number })
    });
  },
  getSession() {
    return this.request('/api/auth/session', { method: 'GET' });
  },
  syncClock() {
    return this.request('/api/clock/sync', { method: 'GET' });
  },
  submit(payload) {
    return this.request('/api/submissions', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
  },
  requestHint(payload) {
    return this.request('/api/hints', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
  },
  accuse(payload) {
    return this.request('/api/accusation', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
  },
  reportFullscreenExit() {
    return this.request('/api/fullscreen/exit', { method: 'POST' });
  },
  adminStartTimer() {
    return this.request('/api/admin/start-timer', { method: 'POST' });
  },
  adminAddUser(register_number, role) {
    return this.request('/api/admin/add-user', {
      method: 'POST',
      body: JSON.stringify({ register_number, role })
    });
  },
  adminOverview() {
    return this.request('/api/admin/overview', { method: 'GET' });
  },
  adminUnblock(request_id, register_number) {
    return this.request('/api/admin/unblock', {
      method: 'POST',
      body: JSON.stringify({ request_id, register_number })
    });
  },
  adminRemoveUser(register_number) {
    return this.request('/api/admin/remove-user', {
      method: 'POST',
      body: JSON.stringify({ register_number })
    });
  },
  adminRevealScores(revealed = true) {
    return this.request('/api/admin/reveal-scores', {
      method: 'POST',
      body: JSON.stringify({ revealed })
    });
  },
  adminResetEvent() {
    return this.request('/api/admin/reset-event', {
      method: 'POST',
      body: JSON.stringify({})
    });
  }
};

// Detective is the id prefix (cho-a, cho-b, cho-v → cho), so new step types need no change here.
const detOf = p => (DATA.detectives.find(d => p.id.startsWith(d.id + '-')) || {}).id;
const chOf = d => PUZZLES.filter(p => detOf(p) === d);
const idx = p => PUZZLES.indexOf(p) + 1;
const topicOf = p => (p.case.match(/\(([^)]+)\)/) || [null, ''])[1];
const detIndex = id => DATA.detectives.findIndex(d => d.id === id);

// Authoritative synchronized time (anchored to server offset)
const now = () => Date.now() + (S.clockOffset || 0) + S.skew;
const MIN = 60000;

// Schedule activates once timer is started by admin or initialized in offline mode
function windows(){
  if(S.t0 == null) return null;
  let t = S.t0 + DATA.timing.readingMin * MIN;
  return DATA.detectives.map(d => { const w = { id:d.id, open:t, close:t + DATA.timing.sectionMin[d.id] * MIN }; t = w.close; return w; });
}
const win = id => (windows() || []).find(w => w.id === id);
const isEventExpired = () => {
  if(S.t0 == null) return false;
  const ws = windows();
  const lastWin = ws && ws.length ? ws[ws.length - 1] : null;
  if(lastWin) return now() >= lastWin.close;
  return false;
};
const areScoresRevealed = () => {
  return Boolean(S.scoresRevealed || S.adminOverview?.event_state?.scores_revealed || isEventExpired());
};
const detUnlocked = id => { const w = win(id); return !!w && now() >= w.open; };
const detClosed = id => { const w = win(id); return !!w && (isEventExpired() || (DATA.timing.closeOnTimeout && now() >= w.close)); };
const detDone = id => chOf(id).every(p => S.subs[p.id]) || detClosed(id);
const sectionsDone = () => isEventExpired() || DATA.detectives.every(d => detDone(d.id));
const pstatus = p => S.subs[p.id] ? 'submitted' : isEventExpired() ? 'expired' : !detUnlocked(detOf(p)) ? 'away' : detClosed(detOf(p)) ? 'expired' : (p.requires && !S.subs[p.requires]) ? 'locked' : 'available';
const fmtMs = ms => { const x = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(x / 60)) + ':' + pad(x % 60); };
const until = ts => `<span class="cd" data-until="${ts}">${fmtMs(ts - now())}</span>`;
const hhmm = ts => new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
const STATUS = { available:['available','Open'], locked:['locked','Locked'], away:['locked','In the field'], expired:['locked',"Time's up"], submitted:['completed','Answer recorded'] };
const statusChip = s => `<span class="status st-${STATUS[s][0]}">${STATUS[s][1]}</span>`;
const completed = () => PUZZLES.filter(p => S.subs[p.id]).length;
const STEPS = [
  ['brief','#/briefing','01','Case briefing'], ['ev','#/evidence','02','Evidence'], ['sus','#/suspects','03','Suspects'],
  ['dash','#/investigation','04','Investigation'], ['fd','#/final-deduction','05','Final deduction'], ['res','#/results','06','Case summary']
];
const stepNo = key => STEPS.find(x => x[0] === key)[2];
function pager(key){
  const i = STEPS.findIndex(x => x[0] === key), prev = STEPS[i-1], next = STEPS[i+1];
  return `<nav class="pager" aria-label="Previous and next step">${motif({ brief:'briefing', dash:'dash' }[key])}

    ${next ? `<a class="next" href="${next[1]}"><small>Next step</small><strong>${next[2]} ${next[3]}</strong></a>` : ''}</nav>`;
}
function fieldCard(d, size=''){
  const w = win(d.id);

  return `<div class="field-card ${size}" role="status">

function clockState(){
  const ws = windows(), t = now();
  if(!ws) return { label:'Case clock', msg:'Starts when you open 01 Case briefing.' };
  if(sectionsDone()) return { label:'Case clock', msg:'All four cases are closed.' };
  if(t < ws[0].open) return { label:'Reading time', from:S.t0, ts:ws[0].open, msg:"Cho's case opens when this ends." };
  const cur = ws.find(w => t >= w.open && t < w.close);
  if(!cur) return { label:'Case clock', msg:'All four cases are closed.' };
  const d = det(cur.id), nd = DATA.detectives[detIndex(cur.id)+1], done = chOf(cur.id).every(p => S.subs[p.id]);
  return { label:`${d.name}'s case`, from:cur.open, ts:cur.close,
    msg: done ? (nd ? `Submitted. ${nd.name} arrives when this ends.` : 'Submitted.') : (nd ? `Closes when this ends, and ${nd.name} arrives.` : 'Closes when this ends.') };
}

}

                   : `<a class="go" href="#/challenge/${p.id}" aria-label="${label}: ${d.name}, ${p.title}">${label}</a>`}</li>`;
}

function bindDetectivePage(id){
  const list = chOf(id);
  list.forEach(p => {
    if(S.subs[p.id]) return;
    const f = fmtOf(p);
    const clearErr = () => {
      if(S.err === p.id){
        S.err = null;
        $(`#ans-${p.id}`)?.removeAttribute('aria-invalid');
        $(`#ans-err-${p.id}`)?.remove();
      }
    };

    if(f.kind === 'time'){
      const t = S.pendingTime[p.id] = S.pendingTime[p.id] || { h:'', m:'' };
      $(`#ans-${p.id}`)?.addEventListener('input', e => {
        t.h = e.target.value;
        clearErr();
        if(t.h.length === 2) $(`#ans-${p.id}-m`)?.focus();
      });
      $(`#ans-${p.id}-m`)?.addEventListener('input', e => {
        t.m = e.target.value;
        clearErr();
      });
      document.querySelectorAll(`#ans-${p.id}, #ans-${p.id}-m`).forEach(i => i.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); $(`#submit-${p.id}`)?.click(); }
      }));
    } else if(f.kind === 'choice'){
      document.querySelectorAll(`input[name="choice-${p.id}"]`).forEach(r => {
        r.addEventListener('change', e => {
          S.pending[p.id] = e.target.value;
          clearErr();
        });
      });
    } else {
      const ans = $(`#ans-${p.id}:not([readonly])`);
      ans?.addEventListener('input', e => {
        S.pending[p.id] = e.target.value;
        clearErr();
      });
      ans?.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); $(`#submit-${p.id}`)?.click(); }
      });
    }

    $(`#submit-${p.id}`)?.addEventListener('click', e => {
      let value;
      if(f.kind === 'time'){
        const t = S.pendingTime[p.id] || { h:'', m:'' };
        if(!t.h.trim() || !t.m.trim()){
          S.err = p.id;
          render();
          $(`#ans-${p.id}`)?.focus();
          return;
        }
        value = `${t.h}:${t.m}`;
      } else {
        value = S.pending[p.id] || '';
        if(!value.trim()){
          S.err = p.id;
          render();
          $(`#ans-${p.id}`)?.focus();
          return;
        }
      }
      confirmSubmit(p, value, e.currentTarget);
    });

    $(`#hint-${p.id}`)?.addEventListener('click', e => {
      confirmHint(p, e.currentTarget);
    });
  });
}

/* ============ CHALLENGE WORKSPACE ============ */
function block(b, p){
  if(b.type==='paragraph') return `<p>${esc(b.text)}</p>`;
  if(b.type==='lines') return `<p class="lines">${b.lines.map(esc).join('<br>')}</p>`;
  if(b.type==='mono') return `<p>${b.label ? esc(b.label)+' ' : ''}<span class="mono-block">${esc(b.text)}</span></p>`;
  if(b.type==='ordered') return `<ol class="sign">${b.items.map(i => `<li>${esc(i)}</li>`).join('')}</ol>`;
  if(b.type==='code') return `<pre class="code" tabindex="0" aria-label="${esc(b.language.toUpperCase())} program"><code>${esc(b.text)}</code></pre>`;
  if(b.type==='asset') return asset(p.assets.find(a => a.id === b.id));
  return '';
}
function asset(a){
  if(!a || a.type!=='table') return '';
  if(a.orientation === 'horizontal'){
    // Same data twice: the PDF's horizontal layout where it fits, transposed where it doesn't. CSS shows one.
    const t = { ...a, orientation:'vertical', row_header:false,
      header:[a.header[0], ...a.rows.map(r => r[0])],
      rows:a.header.slice(1).map((h,i) => [h, ...a.rows.map(r => r[i+1])]) };
    return `<div class="dual">${grid(a)}${grid(t)}</div>`;
  }
  return grid(a);
}
function grid(a){
  const rh = a.row_header !== false;
  return `<div class="grid-wrap"><table class="grid ${a.orientation==='horizontal'?'horiz':''}" aria-label="${esc(a.caption)}">
    <thead><tr>${a.header.map((h,i) => `<th scope="${a.orientation==='horizontal' && i===0 ? 'row' : 'col'}">${h ? esc(h) : '<span class="sr-only">Row</span>'}</th>`).join('')}</tr></thead>
    <tbody>${a.rows.map(r => `<tr>${r.map((c,i) => i===0 && rh ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function promptHTML(p){
  const inline = new Set(p.prompt.body.filter(b => b.type==='asset').map(b => b.id));
  return p.prompt.body.map(b => block(b, p)).join('') + p.assets.filter(a => !inline.has(a.id)).map(asset).join('');
}
function answerForm(p, isDesk = false){
  const f = fmtOf(p), err = S.err === p.id, sending = S.sending === p.id, dis = sending ? 'disabled' : '';
  const inputId = isDesk ? `ans-${p.id}` : 'ans';
  const submitId = isDesk ? `submit-${p.id}` : 'submit';
  const desc = isDesk ? `ans-help-${p.id}${err ? ` ans-err-${p.id}` : ''}` : `ans-help${err ? ' ans-err' : ''}`;
  let control;
  if(f.kind === 'time'){
    const t = S.pendingTime[p.id] || { h:'', m:'' };
    control = `<fieldset class="time-in" aria-describedby="${desc}"><legend class="sr-only">Time: hours and minutes</legend>
      <input id="${inputId}" data-pid="${p.id}" class="input tbox" inputmode="numeric" maxlength="2" placeholder="hh" aria-label="Hours" value="${esc(t.h)}" ${dis} ${err?'aria-invalid="true"':''}>
      <span class="colon" aria-hidden="true">:</span>
      <input id="${inputId}-m" data-pid="${p.id}" class="input tbox" inputmode="numeric" maxlength="2" placeholder="mm" aria-label="Minutes" value="${esc(t.m)}" ${dis}>
    </fieldset>`;
  } else if(f.kind === 'choice'){
    control = `<fieldset class="choice" aria-describedby="${desc}"><legend class="sr-only">${esc(p.prompt.question)}</legend>
      ${f.options.map((o,i) => `<label><input type="radio" name="choice-${p.id}" data-pid="${p.id}" value="${esc(o)}" ${i===0?`id="${inputId}"`:''} ${S.pending[p.id]===o?'checked':''} ${dis}><span>${esc(o)}</span></label>`).join('')}
    </fieldset>`;
  } else {

function receipt(p, sub, isDesk = false){
  const next = PUZZLES.find(x => x.requires === p.id);

  const rcptId = isDesk ? `rcpt-${p.id}` : 'rcpt';
  return `<div class="field"><label for="${inputId}">Your answer</label>
    <input id="${inputId}" class="input locked-in" value="${esc(sub.answer)}" readonly aria-describedby="${rcptId}"></div>

      <div><strong>${p.kind === 'verdict' ? 'Verdict recorded.' : 'Answer recorded.'}</strong> <span class="mono">${clock(sub.recorded_at)}</span><p>This answer is locked and can't be changed.</p></div></div>
    ${p.handoff ? `<blockquote class="story handoff"><span class="mono muted">Handoff</span>${esc(p.handoff)}</blockquote>` : ''}
    ${isDesk ? '' : nextAction(p, next)}`;
}
function nextAction(p, next){
  const act = h => `<div class="actions">${h}</div>`;
  if(next && pstatus(next) === 'available') return act(`<a class="btn" href="#/challenge/${next.id}">Continue to ${next.title}</a>`);
  if(sectionsDone()) return verdictPanel();
  const d = det(detOf(p)), nd = DATA.detectives[detIndex(d.id)+1];
  if(nd && chOf(d.id).every(x => S.subs[x.id])){
    if(detUnlocked(nd.id)) return act(`<a class="btn btn-red" href="#/investigation/${nd.id}">${nd.name} is back. Open ${nd.name}'s case</a>`);
    return `<p class="wait">${d.name}'s case is in. ${nd.name} is back in ${until(win(nd.id).open)}. Use the time to look over the <a class="link" href="#/evidence">evidence</a> and the <a class="link" href="#/suspects">suspects</a>.</p>`;
  }
  return act(`<a class="btn btn-ghost" href="#/investigation">Back to the investigation</a>`);
}
function hintPanel(p, sub, isDesk = false){
  if(!p.hint_available) return '';

  const hintId = isDesk ? `hint-${p.id}` : 'hint';
  if(h) return `<div class="hintbox"><h3>Hint requested</h3><p>Logged at <span class="mono">${clock(h.recorded_at)}</span> with a 60-second penalty. In the live event the hint text appears here, sent by the server.</p></div>`;
  if(sub) return '';
  const at = S.opened[p.id] + HINT_DELAY_MS, ready = now() >= at;
  const when = new Date(at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  return `<div class="hintbox"><h3>Hint</h3><p>One hint for this part. ${ready ? '' : `Available from ${when}. `}Using it adds 60 seconds to your time.</p>
    <button class="btn btn-ghost" id="${hintId}" data-pid="${p.id}" ${ready ? '' : 'disabled'}>Request hint</button></div>`;
}
function workspace(id){

      <div class="actions"><a class="btn" href="#/challenge/${req.id}">Go to ${req.title}</a></div>`;
  } else {
    main = `${p.narrative_intro ? `<blockquote class="story">${esc(p.narrative_intro)}</blockquote>` : ''}

  }
  return shell('det-'+d.id, `
  <div class="crumbs mono"><a href="#/investigation">Investigation</a> / <a href="#/investigation/${d.id}">${d.name}</a> / ${p.title}</div>

      <div class="ws-id">${ASSETS[d.portrait] ? thumb(d.portrait,'sm') : ''}<div><strong>${d.name}</strong><br><span class="mono muted">${topicOf(p)}</span></div></div>

      <ol>${chOf(d.id).map(x => `<li><a href="#/challenge/${x.id}" ${x.id===id?'aria-current="page"':''}><span class="n">${pad(idx(x))}</span><span>${x.title}<br>${statusChip(pstatus(x))}</span></a></li>`).join('')}</ol>
      <h2>Other cases</h2>
      <ol>${DATA.detectives.filter(x => x.id !== d.id).map(x => `<li><a href="#/investigation/${x.id}"><span class="n">${x.name[0]}</span><span>${x.name}</span></a></li>`).join('')}</ol>

      <ul class="fact-list">${DATA.evidence.map(e => `<li><span class="mono">${e.id}</span><a class="link" href="#/evidence?open=${e.id}">${e.title}</a></li>`).join('')}</ul>
    </aside>
  </div>`);
}
function bindWorkspace(id){
  const p = PUZZLES.find(x => x.id === id); if(!p) return;
  const f = fmtOf(p), submit = () => $('#submit')?.click();
  const clearErr = () => { if(S.err === id){ S.err = null; $('#ans')?.removeAttribute('aria-invalid'); $('#ans-err')?.remove(); } };
  if(f.kind === 'time'){
    const t = S.pendingTime[id] = S.pendingTime[id] || { h:'', m:'' };
    $('#ans')?.addEventListener('input', e => { t.h = e.target.value; clearErr(); if(t.h.length === 2) $('#ans-m')?.focus(); });
    $('#ans-m')?.addEventListener('input', e => { t.m = e.target.value; clearErr(); });
    document.querySelectorAll('.time-in input').forEach(i => i.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } }));
  } else if(f.kind === 'choice'){
    document.querySelectorAll('input[name="choice"]').forEach(r => r.addEventListener('change', e => { S.pending[id] = e.target.value; clearErr(); }));
  } else {
    const ans = $('#ans:not([readonly])');
    ans?.addEventListener('input', e => { S.pending[id] = e.target.value; clearErr(); });
    ans?.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
  }
  $('#submit')?.addEventListener('click', e => {
    let value;
    if(f.kind === 'time'){
      const t = S.pendingTime[id];
      if(!t.h.trim() || !t.m.trim()){ S.err = id; render(); $('#ans')?.focus(); return; }
      value = `${t.h}:${t.m}`;   // composed from the two boxes; digits kept exactly as typed
    } else {
      value = S.pending[id] || '';
      if(!value.trim()){ S.err = id; render(); $('#ans')?.focus(); return; }
    }
    confirmSubmit(p, value, e.currentTarget);   // no trimming, no case changes: the server normalizes
  });
  $('#hint')?.addEventListener('click', e => confirmHint(p, e.currentTarget));
}
function confirmSubmit(p, value, opener){
  const d = det(detOf(p));
  openDialog(`<div class="dlg-in"><button class="dlg-x" data-close aria-label="Cancel">✕</button>
    <div class="mono muted">${d.name}, ${p.title}</div><h2 id="dlg-title">Lock in this answer?</h2>
    <p class="answer-preview">${esc(value)}</p>
    <p class="muted" style="font-size:.9rem">Once submitted, it can't be changed.</p>
    <div class="actions"><button class="btn btn-ghost" data-close>Keep editing</button><button class="btn btn-red" id="confirm-sub">Submit answer</button></div></div>`, opener);
  $('#confirm-sub').addEventListener('click', async () => {
    closeDialog(); S.sending = p.id; render();
    const r = await API.submit({ participant_id:S.participant, puzzle_id:p.id, submitted_answer:value, timestamp:new Date().toISOString() });
    S.sending = null; S.subs[p.id] = { answer:value, recorded_at:r.recorded_at }; delete S.pending[p.id]; delete S.pendingTime[p.id];
    render(); $('#rcpt')?.focus();
  });
}
function confirmHint(p, opener){
  openDialog(`<div class="dlg-in"><button class="dlg-x" data-close aria-label="Cancel">✕</button>
    <div class="mono muted">${det(detOf(p)).name}, ${p.title}</div><h2 id="dlg-title">Use your hint?</h2>
    <p>This adds 60 seconds to your total time. There's one hint for this part.</p>
    <div class="actions"><button class="btn btn-ghost" data-close>Not yet</button><button class="btn btn-red" id="confirm-hint">Use hint</button></div></div>`, opener);
  $('#confirm-hint').addEventListener('click', async () => {
    closeDialog();
    const r = await API.requestHint({ participant_id:S.participant, puzzle_id:p.id, timestamp:new Date().toISOString() });
    S.hints[p.id] = r; render();
  });
}

function bindLogin(){
  const form = $('#login-form');
  if(!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    requestAppFullscreen();
    const btn = $('#login-submit-btn');
    const input = $('#reg-num');
    const val = (input?.value || '').trim();
    if(!val) return;
    btn.disabled = true;
    btn.innerHTML = 'VERIFYING... <span class="spinner"></span>';
    S.loginErr = null;
    const oldErr = form.querySelector('.err');
    if(oldErr) oldErr.remove();
    try {
      const data = await API.login(val);
      S.user = {
        register_number: data.register_number,
        role: data.role,
        token: data.token
      };
      S.participant = data.register_number;
      localStorage.setItem('tb_token', data.token);
      await initSession();
      if(S.user.role === 'admin'){
        const ov = await API.adminOverview().catch(() => null);
        if(ov) S.adminOverview = ov;
        location.hash = '#/admin';
      } else {
        location.hash = '#/';
      }
      render();
    } catch(err) {
      btn.disabled = false;
      btn.textContent = 'AUTHORIZE TERMINAL';
      S.loginErr = err.message || 'Authentication failed. Please check your register number.';
      const errDiv = document.createElement('div');
      errDiv.className = 'err mono';
      errDiv.style.marginTop = '.5rem';
      errDiv.textContent = S.loginErr;
      input.parentElement.appendChild(errDiv);
    }
  });
}

}
